<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherify</title>

    <!-- Primary Meta Tags -->
    <meta name="description" content="Get real-time weather updates for any city worldwide with Weatherify." />
    <link rel="canonical" href="https://weatherify-silk.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weatherify-silk.vercel.app/" />
    <meta property="og:title" content="Weatherify - Real-Time Weather App" />
    <meta property="og:description" content="Get real-time weather updates for any city worldwide." />
    <meta property="og:image" content="https://weatherify-silk.vercel.app/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://weatherify-silk.vercel.app/" />
    <meta property="twitter:title" content="Weatherify - Real-Time Weather App" />
    <meta property="twitter:description" content="Get real-time weather updates for any city worldwide." />
    <meta property="twitter:image" content="https://weatherify-silk.vercel.app/preview.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script>/* Prevent theme flash: apply saved theme before paint */(function(){try{var k='weatherify-theme';var s=localStorage.getItem(k);if(s===null){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches? 'dark':'light';}if(s==='dark'){document.documentElement.classList.add('dark-mode');} }catch(e){} })();</script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Components -->
    <script type="module" src="components/weather-header.js"></script>
    <script type="module" src="components/weather-search.js"></script>
    <script type="module" src="components/current-weather.js"></script>
    <script type="module" src="components/forecast-list.js"></script>
    <script type="module" src="components/weather-map.js"></script>
</head>
<body>

    <div class="container">
        <div class="weather-app">
            <weather-header id="app-header"></weather-header>
            <weather-search id="app-search"></weather-search>
            
            <main id="weather-container" class="hidden">
                <current-weather id="main-weather"></current-weather>
                <forecast-list id="daily-forecast"></forecast-list>
                <weather-map id="weather-map-component"></weather-map>
            </main>

            <div id="spinner-loading" class="loading hidden">
                <div class="spinner"></div>
                <p data-i18n="loading">Loading weather data...</p>
            </div>
        </div>
    </div>
    <script src="translations.js"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
